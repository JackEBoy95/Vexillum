<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexillum — Flag Design Studio</title>
  <meta name="description" content="Design beautiful flags with an intuitive layer system. Export SVG and PNG. Free to use.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============================================================
       HEADER
       ============================================================ -->
  <header id="header">
    <div id="logo">VEXILLUM</div>
    <div class="nav-sep"></div>
    <a href="inspire.html" class="header-nav-link">Inspire</a>
    <input id="design-name" type="text" value="Untitled Flag" spellcheck="false" autocomplete="off" title="Click to rename your design">
    <div class="header-spacer"></div>
    <button class="header-btn" id="btn-open" title="Open saved design">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      Open
    </button>
    <button class="header-btn" id="btn-save" title="Save design to browser">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="header-btn" id="btn-export-svg" title="Export as SVG vector file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      SVG
    </button>
    <button class="header-btn primary" id="btn-export-png" title="Export as PNG image">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Export PNG
    </button>
  </header>

  <!-- ============================================================
       LEFT PANEL — Layers
       ============================================================ -->
  <aside id="layers-panel">
    <div class="panel-header">
      <span class="panel-title">Layers</span>
      <div class="palette-select-wrap">
        <span class="palette-select-label">Palette</span>
        <select id="palette-select" class="palette-select">
          <!-- Populated by JS -->
        </select>
      </div>
    </div>

    <div class="add-layer-buttons">
      <button class="add-btn" id="btn-add-hstripes" title="Add horizontal stripe layer">
        <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor">
          <rect y="0" width="14" height="3"/><rect y="4" width="14" height="3"/><rect y="8" width="14" height="2"/>
        </svg>
        H Stripes
      </button>
      <button class="add-btn" id="btn-add-vstripes" title="Add vertical stripe layer">
        <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
          <rect x="0" width="3" height="14"/><rect x="4" width="3" height="14"/><rect x="8" width="2" height="14"/>
        </svg>
        V Stripes
      </button>
      <button class="add-btn" id="btn-add-overlay" title="Add overlay shape layer">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
          <rect x="5" y="0" width="4" height="14"/><rect x="0" y="5" width="14" height="4"/>
        </svg>
        Overlay
      </button>
    </div>

    <div id="layer-list"></div>
  </aside>

  <!-- ============================================================
       CENTRE — Canvas
       ============================================================ -->
  <main id="canvas-area">
    <div id="canvas-wrap">
      <svg id="flag-svg"
           xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 480 320"
           width="480" height="320">
        <!-- Layers and emblems rendered here by JS -->
      </svg>
    </div>

    <!-- Emblem property bar (shown when emblem selected) -->
    <div id="emblem-controls">
      <div class="emblem-ctrl">
        <label>Size</label>
        <input id="ec-size" type="range" min="5" max="80" step="1" value="20">
      </div>
      <div class="emblem-ctrl">
        <label>Rotate</label>
        <input id="ec-rotate" type="range" min="-180" max="180" step="1" value="0">
      </div>
      <div class="emblem-ctrl">
        <label>Flip</label>
        <button class="ec-flip-btn" id="ec-flip-h" title="Flip horizontal">↔</button>
        <button class="ec-flip-btn" id="ec-flip-v" title="Flip vertical">↕</button>
      </div>
      <!-- Game-icon only controls -->
      <div class="emblem-ctrl" id="ec-gameicon-controls">
        <label>Colour</label>
        <input id="ec-fg" type="color" value="#ffffff">
        <label style="font-size:11px;margin-left:6px;display:flex;align-items:center;gap:4px;">
          Bg <input id="ec-bg" type="color" value="#000000">
          <input id="ec-bg-transparent" type="checkbox" checked> None
        </label>
      </div>
      <!-- Heraldic colour remapping controls -->
      <div class="emblem-ctrl" id="ec-heraldic-controls" style="display:none;">
        <label>Tinctures</label>
        <div id="ec-herald-swatches" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
      </div>
      <button class="emblem-delete-btn" id="ec-delete">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
        Remove
      </button>
    </div>
  </main>

  <!-- ============================================================
       RIGHT PANEL — Icon Library
       ============================================================ -->
  <aside id="icons-panel">
    <div class="panel-header">
      <span class="panel-title">Heraldic Icons</span>
    </div>
    <input id="icon-search" type="search" placeholder="Search heraldic icons…" autocomplete="off">
    <div class="icon-categories">
      <!-- Populated by JS -->
    </div>
    <div id="icon-grid">
      <!-- Populated by JS -->
    </div>
  </aside>

</div><!-- #app -->

<!-- ============================================================
     SAVE/OPEN MODAL
     ============================================================ -->
<div id="save-modal" class="modal-overlay hidden">
  <div class="modal" style="position:relative;">
    <button id="modal-close" class="modal-close" title="Close">×</button>
    <h2>Saved Designs</h2>
    <div id="saved-designs-list">
      <!-- Populated by JS -->
    </div>
    <p style="font-size:11px;color:var(--text-dim);margin-top:4px;">
      Free tier: up to 3 saved designs stored in your browser.
    </p>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script src="js/icon-data.js"></script>
<script src="js/icons.js"></script>
<script src="js/heraldic-icons.js"></script>
<script src="js/palettes.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>

</body>
</html>
