<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexillum — Flag Design Studio</title>
  <meta name="description" content="Design beautiful flags with an intuitive layer system. Export SVG and PNG. Free to use.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============================================================
       HEADER
       ============================================================ -->
  <header id="header">
    <div id="logo">VEXILLUM</div>
    <div class="nav-sep"></div>
    <a href="inspire.html" class="header-nav-link">Inspire</a>
    <input id="design-name" type="text" value="Untitled Flag" spellcheck="false" autocomplete="off" title="Click to rename your design">
    <div class="header-spacer"></div>
    <button class="header-btn" id="btn-open" title="Open saved design">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      Open
    </button>
    <button class="header-btn" id="btn-save" title="Save design to browser">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="header-btn" id="btn-export-svg" title="Export as SVG vector file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      SVG
    </button>
    <button class="header-btn" id="btn-preview" title="Preview flag full size">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9l6 6M9 15l6-6"/></svg>
      Preview
    </button>
    <button class="header-btn primary" id="btn-export-png" title="Export as PNG image">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Export PNG
    </button>
  </header>

  <!-- ============================================================
       LEFT PANEL — Layers
       ============================================================ -->
  <aside id="layers-panel">
    <div class="panel-header">
      <span class="panel-title">Layers</span>
      <div class="palette-select-wrap">
        <span class="palette-select-label">Palette</span>
        <select id="palette-select" class="palette-select">
          <!-- Populated by JS -->
        </select>
      </div>
    </div>

    <div class="add-layer-buttons">
      <button class="add-btn" id="btn-add-hstripes" title="Add horizontal stripe layer">
        <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor">
          <rect y="0" width="14" height="3"/><rect y="4" width="14" height="3"/><rect y="8" width="14" height="2"/>
        </svg>
        H Stripes
      </button>
      <button class="add-btn" id="btn-add-vstripes" title="Add vertical stripe layer">
        <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
          <rect x="0" width="3" height="14"/><rect x="4" width="3" height="14"/><rect x="8" width="2" height="14"/>
        </svg>
        V Stripes
      </button>
      <button class="add-btn" id="btn-add-overlay" title="Add overlay shape layer">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
          <rect x="5" y="0" width="4" height="14"/><rect x="0" y="5" width="14" height="4"/>
        </svg>
        Overlay
      </button>
    </div>

    <div id="layer-list"></div>
  </aside>

  <!-- ============================================================
       CENTRE — Canvas
       ============================================================ -->
  <main id="canvas-area">
    <!-- canvas-center keeps the flag and its controls glued together in the centre -->
    <div id="canvas-center">
      <div id="canvas-wrap">
        <svg id="flag-svg"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 480 320"
             width="480" height="320">
          <!-- Layers and emblems rendered here by JS -->
        </svg>
      </div>

      <!-- Emblem property bar (shown when emblem selected) -->
      <div id="emblem-controls">
        <div class="ec-group">
          <span class="ec-lbl" title="Size">⤢</span>
          <input id="ec-size" type="range" min="5" max="80" step="1" value="20" title="Size">
          <span id="ec-size-val" class="ec-val">20</span>
        </div>
        <div class="ec-sep"></div>
        <div class="ec-group">
          <span class="ec-lbl" title="Rotate">↻</span>
          <input id="ec-rotate" type="range" min="-180" max="180" step="1" value="0" title="Rotate">
          <span id="ec-rotate-val" class="ec-val">0°</span>
        </div>
        <div class="ec-sep"></div>
        <div class="ec-group">
          <button class="ec-flip-btn" id="ec-flip-h" title="Flip horizontal">↔</button>
          <button class="ec-flip-btn" id="ec-flip-v" title="Flip vertical">↕</button>
        </div>
        <div class="ec-sep"></div>
        <div class="ec-group" id="ec-gameicon-controls">
          <span class="ec-lbl">Fg</span>
          <input id="ec-fg" type="color" value="#ffffff" title="Icon colour">
          <span class="ec-lbl" style="margin-left:4px;">Bg</span>
          <input id="ec-bg" type="color" value="#000000" title="Background colour">
          <input id="ec-bg-transparent" type="checkbox" checked title="Transparent background" style="margin-left:2px;">
        </div>
        <div class="ec-group" id="ec-heraldic-controls" style="display:none;">
          <span class="ec-lbl">Tints</span>
          <div id="ec-herald-swatches" style="display:flex;gap:3px;align-items:center;"></div>
        </div>
        <div class="ec-group" id="ec-text-controls" style="display:none;">
          <span class="ec-lbl">Text</span>
          <input id="ec-text-content" type="text" class="ec-text-input" placeholder="Text…">
          <select id="ec-text-font" class="ec-text-font">
            <option value="Bebas Neue">Bebas Neue</option>
            <option value="Cinzel">Cinzel</option>
            <option value="Anton">Anton</option>
            <option value="Oswald">Oswald</option>
            <option value="Pirata One">Pirata One</option>
            <option value="DM Sans">DM Sans</option>
          </select>
          <span class="ec-sep"></span>
          <span class="ec-lbl">Arc</span>
          <input id="ec-text-arc" type="range" min="-100" max="100" step="5" value="0" title="Text arc/bend">
          <span id="ec-arc-val" class="ec-val">0</span>
        </div>
        <button class="ec-del-btn" id="ec-delete" title="Remove emblem">✕</button>
      </div>
    </div><!-- /#canvas-center -->
  </main>

  <!-- ============================================================
       RIGHT PANEL — Icon Library
       ============================================================ -->
  <aside id="icons-panel">
    <div class="panel-header">
      <span class="panel-title">Icons &amp; Text</span>
    </div>
    <!-- Text add panel -->
    <div class="text-add-panel">
      <input id="text-content" type="text" placeholder="Type text for your flag…" autocomplete="off">
      <div class="text-add-row">
        <select id="text-font" class="text-font-sel">
          <option value="Bebas Neue">Bebas Neue</option>
          <option value="Cinzel">Cinzel</option>
          <option value="Anton">Anton</option>
          <option value="Oswald">Oswald</option>
          <option value="Pirata One">Pirata One</option>
          <option value="DM Sans">DM Sans</option>
        </select>
        <button id="text-add-btn" class="text-add-btn">Add Text →</button>
      </div>
    </div>
    <!-- Import SVG -->
    <div class="icon-import-row">
      <button class="icon-import-btn" id="svg-import-btn">↑ Import SVG</button>
      <input type="file" id="svg-import-input" accept=".svg" style="display:none;">
    </div>
    <input id="icon-search" type="search" placeholder="Search heraldic icons…" autocomplete="off">
    <div class="icon-categories">
      <!-- Populated by JS -->
    </div>
    <div id="icon-grid">
      <!-- Populated by JS -->
    </div>
  </aside>

</div><!-- #app -->

<!-- ============================================================
     SAVE/OPEN MODAL
     ============================================================ -->
<div id="save-modal" class="modal-overlay hidden">
  <div class="modal" style="position:relative;">
    <button id="modal-close" class="modal-close" title="Close">×</button>
    <h2>Saved Designs</h2>
    <div id="saved-designs-list">
      <!-- Populated by JS -->
    </div>
    <p style="font-size:11px;color:var(--text-dim);margin-top:4px;">
      Free tier: up to 3 saved designs stored in your browser.
    </p>
  </div>
</div>

<!-- Preview Modal -->
<div id="preview-modal" class="modal-overlay hidden">
  <div class="modal" style="position:relative;padding:20px;">
    <button id="preview-close" class="modal-close" title="Close">×</button>
    <h2 style="margin-bottom:12px;">Preview</h2>
    <div id="preview-flag-wrap"></div>
    <div class="preview-actions" style="margin-top:12px;display:flex;gap:8px;justify-content:center;">
      <button class="header-btn primary" id="preview-export-png">Export PNG</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script src="js/icon-data.js"></script>
<script src="js/icons.js"></script>
<script src="js/heraldic-icons.js"></script>
<script src="js/palettes.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>

</body>
</html>
